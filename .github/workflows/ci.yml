name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Markdown and local references
        run: python3 scripts/check_docs.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Production bundle
        run: npm run build

  rust-domain:
    name: Rust domain checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cache Rust domain test artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          shared-key: linux-rust-domain-tests-v1
          cache-on-failure: true
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Domain unit tests
        run: cargo test -p superpower-core
      - name: Task engine unit tests
        run: cargo test -p task-engine

  windows-native:
    # Full Tauri builds take ~4 minutes even with a warm cache; run only on demand.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-windows-ci'))
    name: Windows desktop build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          cache-on-failure: true
          # Seed a separate cache with both release-build and workspace-test artifacts.
          shared-key: windows-native-full-workspace-tests-v1
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Build Tauri application
        run: npm run tauri:build -- --verbose
      - name: Workspace tests (including migration tests)
        run: cargo test --workspace
